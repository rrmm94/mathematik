services:
  mathematik:
    build: .
    image: mathematik:latest
    container_name: mathematik
    restart: unless-stopped
    ports:
      # links: Port im Browser (http://<Server-IP>:3141), rechts: Port im Container (nicht ändern)
      - "3141:3000"
    environment:
      # Zugangsdaten der Lehrkraft beim allerersten Start (danach in den Einstellungen änderbar)
      ADMIN_USER: admin
      ADMIN_PASSWORD: bitte-aendern
      # Nur im Notfall auf "true" setzen: setzt das Admin-Passwort beim Start auf ADMIN_PASSWORD zurück
      ADMIN_RESET: "false"
      # Demo-Kurs mit Beispielkindern anlegen? (true/false)
      SEED_DEMO: "false"
      # Auf "true" setzen, wenn die Seite per HTTPS (z. B. über einen Reverse Proxy) erreichbar ist
      COOKIE_SECURE: "false"
      TZ: Europe/Berlin
    volumes:
      # Datenbank + hochgeladene Bilder – im Unterordner "data" neben dieser Datei
      # (auf dem Server also /opt/stacks/mathematik/data)
      - ./data:/data
